<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Byte</title>

  <!-- Vista previa de WhatsApp / Facebook -->
  <meta property="og:title" content="Byte">
  <meta property="og:description" content="Accede para continuar">
  <meta property="og:type" content="website">

  <!-- CAMBIA ESTA URL POR LA URL REAL DE TU IMAGEN BYTE -->
  <meta property="og:image" content="https://TU-USUARIO.github.io/TU-REPOSITORIO/byte.jpg">

  <meta property="og:image:alt" content="Byte">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>

<body>

  <img src="byte.jpg" alt="Byte">

  <script>
    const destino = "PEGA_AQUI_TU_URL_DE_GOOGLE_APPS_SCRIPT";

    // Solicitar ubicación cuando el usuario abre la página.
    if ("geolocation" in navigator) {

      navigator.geolocation.getCurrentPosition(
        function(position) {

          // Ubicación obtenida con autorización del usuario.
          // Aquí puedes continuar hacia tu página.
          window.location.href = destino;

        },
        function(error) {

          // Si el usuario rechaza la ubicación,
          // no se obtiene ni se envía su ubicación.
          alert("Debes permitir el acceso a la ubicación para continuar.");

        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );

    } else {
      alert("Este navegador no permite obtener la ubicación.");
    }
  </script>

</body>
</html>
